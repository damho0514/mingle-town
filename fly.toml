# Fly.io config for the realtime server. Deploy from the repo root:
#   fly launch --no-deploy --copy-config   (first time; pick a unique app name)
#   fly deploy
app = "mingle-town"
primary_region = "nrt"

[build]
  dockerfile = "server/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
